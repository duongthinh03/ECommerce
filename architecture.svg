<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <radialGradient id="tintA" cx="12%" cy="0%" r="40%">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tintB" cx="95%" cy="5%" r="38%">
      <stop offset="0" stop-color="#dcfce7" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#dcfce7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#334155" flood-opacity="0.18"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="url(#bg)"/>
  <rect width="1000" height="660" fill="url(#tintA)"/>
  <rect width="1000" height="660" fill="url(#tintB)"/>

  <!-- Title -->
  <text x="40" y="46" font-size="26" font-weight="800" fill="url(#titleg)">🛒 ECommerceApi — Kiến trúc hệ thống</text>
  <text x="40" y="72" font-size="14" fill="#64748b">Web TMĐT đa ngành · ASP.NET Core (.NET 10) + EF Core + SQL Server</text>
  <g font-size="12.5" fill="#475569">
    <circle cx="48" cy="96" r="6" fill="#22c55e"/><text x="60" y="100">Đã xong</text>
    <circle cx="148" cy="96" r="6" fill="#f59e0b"/><text x="160" y="100">Đang làm</text>
    <circle cx="252" cy="96" r="6" fill="#94a3b8"/><text x="264" y="100">Chưa làm</text>
  </g>

  <!-- ===== ZONES ===== -->
  <rect x="270" y="128" width="300" height="476" rx="18" fill="#fff7e6" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420" y="154" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">⚙️ Backend API · .NET 10</text>

  <rect x="640" y="128" width="320" height="196" rx="16" fill="#eafaef" stroke="#22c55e" stroke-width="1.5"/>
  <text x="800" y="152" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">🗄️ Lưu trữ</text>

  <rect x="640" y="360" width="320" height="244" rx="16" fill="#e8f1fe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="800" y="384" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">🌐 Dịch vụ ngoài</text>

  <!-- ===== CLIENTS ===== -->
  <g filter="url(#sh)">
    <rect x="40" y="206" width="172" height="66" rx="14" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="40" y="306" width="172" height="66" rx="14" fill="#ffffff" stroke="#94a3b8"/>
  </g>
  <text x="126" y="234" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">👤 Khách</text>
  <text x="126" y="254" font-size="11.5" fill="#64748b" text-anchor="middle">Guest / Customer</text>
  <text x="126" y="334" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">🛠️ Admin / Staff</text>
  <text x="126" y="354" font-size="11.5" fill="#64748b" text-anchor="middle">Admin Panel</text>

  <!-- rail -->
  <rect x="288" y="176" width="3" height="420" rx="2" fill="url(#rail)"/>

  <!-- ===== BACKEND MODULES ===== -->
  <g filter="url(#sh)">
    <rect x="306" y="176" width="246" height="56" rx="12" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="306" y="246" width="246" height="56" rx="12" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="306" y="316" width="246" height="56" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="1.8"/>
    <rect x="306" y="386" width="246" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="306" y="456" width="246" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  </g>
  <text x="429" y="200" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">🔐 Auth · JWT</text>
  <text x="429" y="218" font-size="10.5" fill="#5b7a64" text-anchor="middle">register · login · refresh ✓</text>
  <text x="429" y="270" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">📦 Catalog</text>
  <text x="429" y="288" font-size="10.5" fill="#5b7a64" text-anchor="middle">Category · Product · Variant ✓</text>
  <text x="429" y="340" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">🛒 Cart</text>
  <text x="429" y="358" font-size="10.5" fill="#9a6a3a" text-anchor="middle">đang làm · chặng 1/4</text>
  <text x="429" y="418" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">🧾 Order</text>
  <text x="429" y="436" font-size="10.5" fill="#64748b" text-anchor="middle">checkout · trừ kho · snapshot</text>
  <text x="429" y="488" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">💳 Payment</text>
  <text x="429" y="506" font-size="10.5" fill="#64748b" text-anchor="middle">VNPay/Momo · IPN</text>

  <!-- (rail chỉ là spine trang trí, không đánh số để khỏi trùng số luồng) -->

  <!-- ===== DATA ===== -->
  <g filter="url(#sh)">
    <rect x="670" y="168" width="262" height="56" rx="12" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="670" y="244" width="262" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  </g>
  <text x="801" y="192" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">🗃️ SQL Server</text>
  <text x="801" y="210" font-size="10.5" fill="#5b7a64" text-anchor="middle">Docker :14330 · 15 bảng ✓</text>
  <text x="801" y="268" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">⚡ Redis</text>
  <text x="801" y="286" font-size="10.5" fill="#64748b" text-anchor="middle">cache · giỏ guest (Phase sau)</text>

  <!-- ===== EXTERNAL ===== -->
  <g filter="url(#sh)">
    <rect x="670" y="404" width="262" height="56" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="670" y="478" width="262" height="56" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
  </g>
  <text x="801" y="428" font-size="13.5" font-weight="700" fill="#1e40af" text-anchor="middle">💳 VNPay / Momo / ZaloPay</text>
  <text x="801" y="446" font-size="10.5" fill="#3b6bb5" text-anchor="middle">return URL + IPN webhook</text>
  <text x="801" y="502" font-size="13.5" font-weight="700" fill="#1e40af" text-anchor="middle">📧 Gmail SMTP</text>
  <text x="801" y="520" font-size="10.5" fill="#3b6bb5" text-anchor="middle">OTP · xác nhận đơn</text>

  <!-- ===== ARROWS ===== -->
  <path d="M212,239 C240,239 250,288 268,288" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="220" y="262" font-size="11" fill="#475569">① REST</text>
  <path d="M212,339 C240,339 250,368 268,368" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="224" y="356" font-size="11" fill="#475569">REST</text>

  <path d="M552,272 C600,272 612,196 668,196" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="582" y="214" font-size="11" fill="#475569">② EF Core</text>

  <path d="M552,338 C605,338 615,272 668,272" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="572" y="300" font-size="10.5" fill="#64748b">cache</text>

  <path d="M552,470 C605,470 620,430 668,430" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="566" y="452" font-size="10.5" fill="#1d4ed8">③ redirect</text>
  <path d="M668,448 C620,448 605,492 556,492" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrB)"/>
  <text x="566" y="510" font-size="10.5" fill="#1d4ed8">④ IPN verify</text>

  <path d="M552,418 C618,418 600,506 668,506" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrB)"/>
  <text x="582" y="406" font-size="10.5" fill="#1d4ed8">⑤ email</text>
</svg>
