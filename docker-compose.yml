services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecom-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "14330:1433"
    volumes:
      - ecom-sqldata:/var/opt/mssql
    restart: unless-stopped

volumes:
  ecom-sqldata:
    external: true
